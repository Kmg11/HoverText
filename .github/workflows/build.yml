name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file EXE
        run: >
          dotnet publish HoverText.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '1.0.0' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss `
            /DAppVersion=$ver `
            /DPublishDir=..\publish `
            /DOutputDir=..\bin\Release\installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer
          path: bin/Release/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: installer
          path: setup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          body: |
            ## What's new
            - Brand-new landing page with an interactive demo: hold Left Ctrl
              and hover over the browser mockup to see the overlay work live.
            - "About the creator" section with GitHub and LinkedIn links.

            ## Fixes
            - Holding the trigger key no longer clashes with other shortcuts
              (Ctrl+C, Ctrl+Alt+Wheel) — the overlay backs off instead of flashing.
            - Uninstall now fully removes the app folder and settings.
            - Cleaned up documentation; removed Mac/Apple references throughout.

            ## Download
            - Windows installer: HoverTextSetup-0.0.2.exe
          files: |
            setup/*.exe
